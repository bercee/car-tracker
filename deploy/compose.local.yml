name: car-tracker-local

services:
  frontend:
    image: car-tracker-frontend:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    networks:
      app:
        aliases:
          - car-tracker-frontend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: car_tracker
      POSTGRES_USER: car_tracker
      POSTGRES_PASSWORD: car_tracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U car_tracker -d car_tracker']
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - app

  migrate:
    image: car-tracker-backend:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ['node', 'dist/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment: &database
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: car_tracker
      DB_USER: car_tracker
      DB_PASSWORD: car_tracker
    networks:
      - app

  backend:
    image: car-tracker-backend:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database
      HOST: 0.0.0.0
      PORT: '3000'
    networks:
      app:
        aliases:
          - car-tracker-backend

  proxy:
    image: nginx:1.30.5-alpine-slim
    depends_on:
      - backend
      - frontend
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./reverse-proxy.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app

volumes:
  postgres-data:

networks:
  app:
