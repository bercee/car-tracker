name: car-tracker-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: car_tracker
      POSTGRES_USER: car_tracker
      POSTGRES_PASSWORD: car_tracker
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U car_tracker -d car_tracker']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
